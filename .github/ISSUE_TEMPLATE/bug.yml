name: Bug report
description: Capture a reproducible failure or musical mismatch.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, small original text fixture, parameters/seed, and source revision. Keep personal audio and binary artifacts out of Git.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: OS/CPU/toolchain, relevant local CI result, measured output, and device details if applicable. Include whether the failure was observed in the UI or heard.
    validations:
      required: true
