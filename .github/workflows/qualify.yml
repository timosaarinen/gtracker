name: Manual cross-platform qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS release work is deferred until native Intel MBP qualification.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Enable MSVC for the Ninja generator
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install pinned Ninja
        run: python -m pip install --disable-pip-version-check ninja==1.11.1.4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool libsdl1.2-dev ffmpeg fonts-dejavu-core pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxrender-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libgl1-mesa-dev
      - name: Prepare pinned Linux SID backend
        if: runner.os == 'Linux'
        run: python tools/sid_backend.py prepare
      - name: Inspect toolchain
        run: python tools/dev.py doctor
      - name: Run headless local qualification suite
        run: python tools/dev.py ci
      - name: Configure desktop
        run: python tools/dev.py configure --profile desktop
      - name: Compile desktop (does not exercise a real window or audio device)
        run: python tools/dev.py build --profile desktop
      - name: Run desktop regression tests with dummy video/audio
        run: python tools/dev.py test --profile desktop
      - name: Check authoring integration with generated captures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Linux realtime SID against offline output
        if: runner.os == 'Linux'
        run: python tools/sid_stream_verify.py
      - name: Assemble Linux candidate (Windows packages use the local MSYS2 recipe)
        if: runner.os == 'Linux'
        run: python tools/dev.py package --profile desktop
      - name: Verify Linux package relocation and exports
        if: runner.os == 'Linux'
        run: python tools/verify_package.py .local/packages/gtracker-desktop-Linux-x86_64.zip
      - name: Preserve qualification evidence and example render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ matrix.os }}
          path: |
            .local/ci/
            .local/demo.wav
            .local/packages/*.zip
            .local/package-checks/**/report.json
            .local/package-checks/**/*.log
            .local/sid/stream-verification/report.json
            .local/build/desktop/Testing/Temporary/LastTest.log
            .local/build/desktop/editor-smoke.bmp
            .local/build/desktop/editor-unsaved-dialog.bmp
            .local/build/desktop/editor-source-comparison.bmp
            .local/build/desktop/editor-take-smoke.bmp
            .local/build/desktop/editor-slide-smoke.bmp
            .local/build/desktop/editor-slide-controls.bmp
            .local/build/desktop/editor-timeline-compact.bmp
            .local/build/desktop/editor-production-controls.bmp
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
